name: Neovim Oil navigation

on:
  push:
    paths:
      - dotfiles/nvim/lua/plugins/oil.lua
      - tests/nvim/oil_shift_navigation.lua
      - .github/workflows/nvim-oil-navigation.yml
  pull_request:
    paths:
      - dotfiles/nvim/lua/plugins/oil.lua
      - tests/nvim/oil_shift_navigation.lua
      - .github/workflows/nvim-oil-navigation.yml

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim 0.11.7
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.7/nvim-linux-x86_64.tar.gz -o /tmp/nvim.tar.gz
          tar -xzf /tmp/nvim.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Test Oil Shift+Arrow movement
        run: nvim --headless -u NONE -l tests/nvim/oil_shift_navigation.lua
