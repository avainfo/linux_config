name: Neovim Telescope visual grep

on:
  push:
    paths:
      - dotfiles/nvim/lua/plugins/telescope.lua
      - tests/nvim/telescope_visual_grep.lua
      - .github/workflows/nvim-telescope-visual-grep.yml
  pull_request:
    paths:
      - dotfiles/nvim/lua/plugins/telescope.lua
      - tests/nvim/telescope_visual_grep.lua
      - .github/workflows/nvim-telescope-visual-grep.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim 0.11.7
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.7/nvim-linux-x86_64.tar.gz -o /tmp/nvim.tar.gz
          tar -xzf /tmp/nvim.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Test visual live grep selection and clipboards
        run: nvim --headless -u NONE -l tests/nvim/telescope_visual_grep.lua
