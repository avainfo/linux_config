name: Neovim MIT headers

on:
  push:
    paths:
      - dotfiles/nvim/lua/ava/header.lua
      - tests/nvim/header_creation.lua
      - .github/workflows/nvim-headers.yml
  pull_request:
    paths:
      - dotfiles/nvim/lua/ava/header.lua
      - tests/nvim/header_creation.lua
      - .github/workflows/nvim-headers.yml

jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim 0.11.7
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.7/nvim-linux-x86_64.tar.gz -o /tmp/nvim.tar.gz
          tar -xzf /tmp/nvim.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Check MIT header creation
        run: nvim --headless -u NONE -l tests/nvim/header_creation.lua
