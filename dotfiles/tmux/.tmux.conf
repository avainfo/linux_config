set-option -sg escape-time 10
set-option -g focus-events on

set -g mouse on
set -g xterm-keys on

set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Navigation: Ctrl+b + arrows, including when Ctrl is still held.
bind-key -T prefix C-Left  select-pane -L
bind-key -T prefix C-Right select-pane -R
bind-key -T prefix C-Up    select-pane -U
bind-key -T prefix C-Down  select-pane -D

# Resize: Alt + arrows, directly (no tmux prefix).
bind-key -n M-Left  resize-pane -L 3
bind-key -n M-Right resize-pane -R 3
bind-key -n M-Up    resize-pane -U 3
bind-key -n M-Down  resize-pane -D 3

# splits [FR]
bind ] split-window -h -c "#{pane_current_path}"
bind \' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

set -g status-interval 5
set -g status-justify centre
set -g window-style 'fg=colour247,bg=colour234'
set -g window-active-style 'fg=colour250,bg=colour234'
set -g status-bg colour234
set -g status-fg white
set -g status-left " #[fg=red]Ava Info"
set -g status-right "#[fg=red]#(date '+%H:%M') "
set -g window-status-current-format "#{?#{==:#{session_windows},1},#[fg=gold]#{pane_current_path}#[default],#[fg=gold] #I:#W #[default]}"
set -g window-status-format "#{?#{==:#{session_windows},1},,#[fg=colour245] #I:#W #[default]}"
set-option -g set-titles on
set-option -g set-titles-string "tmux"

# set -g pane-border-status top
# set -g pane-border-format " #{?#{==:#{pane_current_path},$HOME},~,#{?#{m:^$HOME,#{pane_current_path}},~#{s:^$HOME,,:#{pane_current_path}},#{pane_current_path}}} "

# Copy mode Vim
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi Escape send-keys -X clear-selection
